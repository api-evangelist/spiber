aid: spiber
name: Spiber
description: >-
  Spiber Inc. is a Japanese biotechnology and advanced-materials company founded in 2007 and
  headquartered in Tsuruoka, Yamagata Prefecture, Japan. Spiber develops Brewed Protein materials —
  structural proteins produced by precision fermentation of plant-derived sugars using engineered
  microbes, then spun into fibers, resins, and films as animal-free, petroleum-free alternatives to
  silk, wool, cashmere, leather, and synthetic polymers. The company operates fermentation plants in
  Japan, Thailand, and the United States and supplies apparel, outdoor, automotive, and consumer
  brands, alongside a research program in synthetic biology, polymer science, and life-cycle
  assessment. Spiber is a materials manufacturer rather than a software vendor and publishes no
  developer program, developer portal, SDKs, or product API; the only machine-readable HTTP surface
  it serves is the read-only WordPress REST content API behind its corporate website.
