apis:
- aid: spiber-content-api
  name: Spiber Content API (WordPress REST)
  description: >-
    The read-only WordPress REST API that backs spiber.inc. The service names itself "Spiber API"
    in its own discovery document and is referenced from spiber.inc/robots.txt as the origin of the
    site sitemap. It exposes the standard wp/v2 content namespace (posts, pages, media, taxonomies,
    types) plus a small custom/v1 namespace the site uses for menus and news listings. It is
    corporate-website infrastructure, not a published developer product: Spiber advertises no
    developer program, publishes no reference documentation for it, and marks every response
    x-robots-tag noindex. Anonymous GET access to the content routes is confirmed live; write,
    admin, migration, and jwt-auth routes are permission-gated.
  humanURL: https://spiber.inc/en
  baseURL: https://spiber.xsrv.jp/api/wp-json
