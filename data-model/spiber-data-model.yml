generated: '2026-08-29'
method: probed
source: >-
  https://spiber.xsrv.jp/api/wp-json/wp/v2/types (HTTP 200) and
  https://spiber.xsrv.jp/api/wp-json/wp/v2/taxonomies (HTTP 200)
note: >-
  Derived entirely from the live type and taxonomy registries the service publishes about itself.
  The custom post types are the interesting part: they are Spiber's own content model — projects,
  news, news_en, academic-papers, creations, positions — with a department taxonomy shared between
  projects and open positions, and separate news categories per language. The generic WordPress
  block-editor types (templates, global styles, font families) are recorded for completeness but
  carry no Spiber domain meaning.
api: spiber-content-api
base_url: https://spiber.xsrv.jp/api/wp-json
entities:
- name: post
  rest_base: posts
  path: /wp/v2/posts
  hierarchical: false
  domain: generic
- name: page
  rest_base: pages
  path: /wp/v2/pages
  hierarchical: true
  domain: generic
  record_count_observed: 20
- name: attachment
  rest_base: media
  path: /wp/v2/media
  hierarchical: false
  domain: generic
- name: news
  rest_base: news
  path: /wp/v2/news
  hierarchical: false
  domain: spiber
  description: Japanese-language news items behind spiber.inc/ja/news
- name: news_en
  rest_base: news_en
  path: /wp/v2/news_en
  hierarchical: false
  domain: spiber
  description: English-language news items behind spiber.inc/en/news
- name: academic-papers
  rest_base: academic-papers
  path: /wp/v2/academic-papers
  hierarchical: false
  domain: spiber
  description: Spiber's published research output, rendered at spiber.inc/en/academic-papers
- name: projects
  rest_base: projects
